[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bilibili-multi-part"
version = "1.0.0"
description = "B站多P课程视频批量下载 + 字幕/本地转写 + 语义问答（RAG）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "caiqianzhang" }]
dependencies = [
    "yt-dlp>=2024.0.0",
    "requests>=2.31.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
# 不生成 LLM 笔记时的最小依赖
base = ["yt-dlp>=2024.0.0", "requests>=2.31.0"]

[project.scripts]
bilibili-multi-part = "bilibili_multi_part:main"

[tool.setuptools]
py-modules = ["bilibili_multi_part", "semantic_qa"]